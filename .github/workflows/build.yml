name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  # Manual re-run of the CurseForge upload for the version on the chosen branch (e.g. a release
  # whose upload failed). Builds, then uploads; no tag or GitHub release is made.
  workflow_dispatch:
    inputs:
      curseforge:
        description: Upload this branch's mod_version jars to CurseForge
        type: boolean
        default: true

permissions:
  contents: write # needed to create releases when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history: the CurseForge step diffs the description per release

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build (compiles + runs tests)
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      # Every build: attach both loader jars to the workflow run so you can download them.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: fw-paint-jars
          path: |
            fabric/build/libs/fw-paint-fabric-*.jar
            neoforge/build/libs/fw-paint-neoforge-*.jar
          if-no-files-found: error

      # On a push to master: read mod_version from gradle.properties; if no matching v<version>
      # tag exists yet, this run creates it AND publishes the release itself. (A tag pushed with
      # the workflow's own token never re-triggers the workflow — GitHub blocks recursive runs —
      # so tagging alone would silently release nothing.)
      - name: Detect new version on master
        id: autotag
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG — will tag and release."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.autotag.outputs.release == 'true'
        run: |
          git tag "${{ steps.autotag.outputs.tag }}"
          git push origin "${{ steps.autotag.outputs.tag }}"

      # One release path for both triggers: a manually pushed v* tag, or the auto-detected
      # version on master.
      - name: Resolve release tag
        id: reltag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.autotag.outputs.release }}" = "true" ]; then
            echo "tag=${{ steps.autotag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # The release body comes from docs/release-notes/<tag>.md when it exists (write one per
      # version), with a generic fallback so a missing file never blocks a release.
      - name: Prepare release notes
        if: steps.reltag.outputs.tag != ''
        run: |
          NOTES="docs/release-notes/${{ steps.reltag.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_BODY.md
          else
            echo "No $NOTES found — using the fallback body."
            cat > RELEASE_BODY.md <<'EOF'
          **FW Paint** — a client-side mod for painting blocks: solid extrude/fill, gradients, and noise.

          Targets: Minecraft **26.3** · Java **25** · Fabric (Loader 0.19.5+ with Fabric API) or NeoForge.

          Install: drop the jar matching your loader (`fw-paint-fabric` or `fw-paint-neoforge`) into a
          26.3 instance's `mods/` folder (Fabric also needs Fabric API for 26.3).
          EOF
          fi

      - name: Publish release
        if: steps.reltag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: FW Paint ${{ steps.reltag.outputs.tag }} (Minecraft 26.3)
          files: |
            fabric/build/libs/fw-paint-fabric-*.jar
            neoforge/build/libs/fw-paint-neoforge-*.jar
          generate_release_notes: true
          body_path: RELEASE_BODY.md

      # CurseForge: both jars, with the release notes as the changelog. Runs for every new release
      # (or a manual dispatch). The Upload API can't edit the project description or gallery, so
      # when docs/curseforge-description.md changed since the last release the job summary says so.
      - name: Upload to CurseForge
        if: steps.reltag.outputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.curseforge)
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          fi
          bash .github/ci/curseforge-upload.sh "$TAG"
          echo "### CurseForge: uploaded $TAG (Fabric + NeoForge)" >> "$GITHUB_STEP_SUMMARY"
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1)
          if [ -n "$PREV" ] && ! git diff --quiet "$PREV" HEAD -- docs/curseforge-description.md docs/images; then
            echo "**The CurseForge description changed since $PREV** - paste docs/curseforge-description.md into the project page (manual: no API for it)." >> "$GITHUB_STEP_SUMMARY"
          fi
