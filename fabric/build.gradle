// Fabric shell: the ClientModInitializer entrypoint + fabric.mod.json, bundling :common's classes
// and assets into the shippable fw-paint-fabric jar.
plugins {
    // 26.1+ uses the NON-remapping loom plugin; needs no mappings (game is unobfuscated).
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'fw-paint-fabric' }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation project(':common')
}

// Common's assets must be part of THIS module's resources: Loom only registers the fabric
// module's own source set with the dev runtime's resource loader, so a plain project dependency
// leaves common's assets (lang, gui sprites) invisible in-dev even though the shipped jar had
// them. Adding the directory here makes dev and the jar see the same files.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    // One self-contained jar: the loader shell plus common's classes (assets already come in
    // through processResources via the shared resources srcDir above).
    from project(':common').sourceSets.main.output.classesDirs
}
